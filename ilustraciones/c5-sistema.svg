<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Sistema de almacenaje</title><desc id="desc">Una unidad paletizada pasa de recepción a almacenaje y luego a despacho; las flechas indican la secuencia.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#18364a">Flujo de una unidad de carga</text><rect x="18" y="105" width="115" height="135" rx="8" fill="#fff" stroke="#1b5379" stroke-width="4"/><text x="75" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">Recepción</text><rect x="40" y="158" width="70" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="40" y1="211" x2="110" y2="211" stroke="#1b5379" stroke-width="5"/><line x1="48" y1="211" x2="48" y2="218" stroke="#1b5379" stroke-width="3"/><line x1="102" y1="211" x2="102" y2="218" stroke="#1b5379" stroke-width="3"/><rect x="182" y="85" width="116" height="155" rx="8" fill="#fff" stroke="#1b5379" stroke-width="4"/><text x="240" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">Almacenaje</text><line x1="198" y1="135" x2="198" y2="215" stroke="#1b5379" stroke-width="7"/><line x1="282" y1="135" x2="282" y2="215" stroke="#1b5379" stroke-width="7"/><line x1="198" y1="175.0" x2="282" y2="175.0" stroke="#1b5379" stroke-width="6"/><line x1="198" y1="215" x2="282" y2="215" stroke="#1b5379" stroke-width="6"/><rect x="207" y="143" width="64" height="29" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="207" y1="177" x2="271" y2="177" stroke="#1b5379" stroke-width="5"/><line x1="215" y1="177"