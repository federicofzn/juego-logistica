<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Put to light</title><desc id="descripcion">Una persona distribuye artículos en contenedores de pedidos. La flecha apunta a los contenedores y una luz con el número 2 identifica el destino y la cantidad a depositar.</desc>
