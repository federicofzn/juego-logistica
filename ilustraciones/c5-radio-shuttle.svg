<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Radio-shuttle</title><desc id="desc">Una lanzadera con ruedas transporta un pallet dentro del canal sobre carriles; el autoelevador permanece en la cabecera. La flecha indica el movimiento de la lanzadera.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#18364a">Radio-shuttle</text><line x1="90" y1="222" x2="430" y2="222" stroke="#1b5379" stroke-width="7"/><line x1="90" y1="242" x2="430" y2="242" stroke="#1b5379" stroke-width="5"/><rect x="205" y="120" width="100" height="55" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="205" y1="180" x2="305" y2="180" stroke="#1b5379" stroke-width="5"/><line x1="213" y1="180" x2="213" y2="187" stroke="#1b5379" stroke-width="3"/><line x1="297" y1="180" x2="297" y2="187" stroke="#1b5379" stroke-width="3"/><rect x="200" y="188" width="110" height="24" rx="5" fill="#e9b16d" stroke="#bd5e18" stroke-width="3"/><circle cx="220" cy="216" r="6" fill="white" stroke="#1b5379" stroke-width="3"/><circle cx="290" cy="216" r="6" fill="white" stroke="#1b5379" stroke-width="3"/><line x1="160" y1="300" x2="380" y2="300" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="255" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">lanzadera dentro del canal</text><g transform="translate(12 160) scale(0.75)"><rect x="5" y="48" width="77" height="34" rx="5" fill="#e9b16d" stroke="#1b5379" stroke-width="4"/><path d="M 22 48 L 32 14 L 66 14 L 78 48 Z" fill="#dcecf4" stroke="#1b5379" stroke-width="4" stroke-linejoin="round"/><line x1="32" y1="14" x2="25" y2="48" stroke="#1b5379" stroke-width="4"/><line x1="66" y1="14" x2="66" y2="48" stroke="#1b5379" stroke-width="4"/><circle cx="23" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><circle cx="68" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><line x1="91" y1="4" x2="91" y2="84" stroke="#1b5379" stroke-width="7"/><line x1="101" y1="4" x2="101" y2="84" stroke="#1b5379" stroke-width="4"/><path d="M 101 80 L 145 80" fill="none" stroke="#1b5379" stroke-width="6" stroke-linejoin="round"/></g><text x="77" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#18364a">cabecera</text></svg>