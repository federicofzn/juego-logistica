<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Drive-in: LIFO</title><desc id="desc">Una carretilla entra por el extremo derecho a un canal cerrado al fondo. Entran A y después B; B, más cerca de la entrada, sale primero. Flechas de entrada y salida apuntan en sentidos opuestos por el mismo extremo.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#18364a">Drive-in: un solo extremo</text><line x1="55" y1="95" x2="405" y2="95" stroke="#1b5379" stroke-width="7"/><line x1="55" y1="260" x2="405" y2="260" stroke="#1b5379" stroke-width="7"/><line x1="55" y1="95" x2="55" y2="260" stroke="#1b5379" stroke-width="7"/><line x1="55" y1="250" x2="405" y2="250" stroke="#1b5379" stroke-width="6"/><rect x="75" y="180" width="90" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="75" y1="233" x2="165" y2="233" stroke="#1b5379" stroke-width="5"/><line x1="83" y1="233" x2="83" y2="240" stroke="#1b5379" stroke-width="3"/><line x1="157" y1="233" x2="157" y2="240" stroke="#1b5379" stroke-width="3"/><text x="120.0" y="211.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">A</text><rect x="180" y="180" width="90" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="180" y1="233" x2="270" y2="233" stroke="#1b5379" stroke-width="5"/><line x1="188" y1="233" x2="188" y2="240" stroke="#1b5379" stroke-width="3"/><line x1="262" y1="233" x2="262" y2="240" stroke="#1b5379" stroke-width="3"/><text x="225.0" y="211.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">B</text><g transform="translate(425 164) scale(-0.8 0.8)"><rect x="5" y="48" width="77" height="34" rx="5" fill="#e9b16d" stroke="#1b5379" stroke-width="4"/><path d="M 22 48 L 32 14 L 66 14 L 78 48 Z" fill="#dcecf4" stroke="#1b5379" stroke-width="4" stroke-linejoin="round"/><line x1="32" y1="14" x2="25" y2="48" stroke="#1b5379" stroke-width="4"/><line x1="66" y1="14" x2="66" y2="48" stroke="#1b5379" stroke-width="4"/><circle cx="23" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><circle cx="68" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><line x1="91" y1="4" x2="91" y2="84" stroke="#1b5379" stroke-width="7"/><line x1="101" y1="4" x2="101" y2="84" stroke="#1b5379" stroke-width="4"/><path d="M 101 80 L 145 80" fill="none" stroke="#1b5379" stroke-width="6" stroke-linejoin="round"/></g><text x="108" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">fondo</text><text x="365" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">acceso</text><line x1="390" y1="83" x2="285" y2="83" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><line x1="285" y1="300" x2="410" y2="300" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="240" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">Entra A, luego B; sale B primero</text></svg>