<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Lectura y derivación</title><desc id="descripcion">Una caja llega al lector de etiquetas. Una flecha conduce al destino cuando se identifica el código; otra deriva las etiquetas ilegibles a revisión y reetiquetado.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1b5379"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#1b5379}.label{font-size:19px;font-weight:700}.small{font-size:17px}.accent{font-size:19px;font-weight:700;fill:#bd5e18}</style>
