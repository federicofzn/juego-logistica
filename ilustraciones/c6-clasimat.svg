<title id="titulo">Clasimat vertical</title><desc id="descripcion">En un equipo cerrado, bandejas se almacenan a ambos lados de una lanzadera central. La lanzadera toma una bandeja y la desplaza verticalmente hacia la abertura de trabajo, donde espera una persona.</desc>
