<rect width="480" height="360" fill="#f8fbfc"/><circle cx="95" cy="133" r="10" fill="#1b5379"/><path d="M95 145v30 m-17-17 17-10 17 10 m-17 17 -13 21 m13-21 13 21" fill="none" stroke="#1b5379" stroke-width="5" stroke-linecap="round"/><rect x="155" y="170" width="35" height="29" rx="2" fill="#f9dfc6" stroke="#bd5e18" stroke-width="3"/><line x1="172.5" y1="170" x2="172.5" y2="177" stroke="#bd5e18" stroke-width="3"/><line x1="200" y1="184" x2="260" y2="184" stroke="#1b5379" stroke-width="3" marker-end="url(#a)"/><rect x="270" y="120" width="150" height="115" rx="4" fill="#fff" stroke="#1b5379" stroke-width="3"/><rect x="285" y="140" width="48" height="60" rx="4" fill="#edf5f8" stroke="#1b5379" stroke-width="3"/><rect x="355" y="140" width="48" height="60" rx="4" fill="#edf5f8" stroke="#1b5379" stroke-width="3"/><rect x="360" y="202" width="38" height="28" rx="4" fill="#ffe6ae" stroke="#bd5e18" stroke-width="3"/><text x="379" y="222" class="accent" text-anchor="middle">2</text><text x="100" y="252" class="label" text-anchor="middle">Operario</text><text x="345" y="103" class="label" text-anchor="middle">Pedidos</text><text x="240" y="306" class="label" text-anchor="middle">Depositar 2 unidades</text></svg>