<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Control, embalaje y salida</title><desc id="descripcion">Un pedido pasa de control y embalaje a una caja identificada, después a clasificación por destino y finalmente a la salida. Las flechas muestran la secuencia.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1b5379"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#1b5379}.label{font-size:19px;font-weight:700}.small{font-size:17px}.accent{font-size:19px;font-weight:700;fill:#bd5e18}</style>
<rect width="480" height="360" fill="#f8fbfc"/><rect x="25" y="115" width="110" height="80" rx="4" fill="#fff" stroke="#1b5379" stroke-width="3"/><text x="80" y="148" class="small" text-anchor="middle">Control</text><text x="80" y="175" class="small" text-anchor="middle">y embalaje</text><rect x="165" y="133" width="50" height="40" rx="2" fill="#f9dfc6" stroke="#bd5e18" stroke-width="3"/><line x1="190.0" y1="133" x2="190.0" y2="140" stroke="#bd5e18" stroke-width="3"/><line x1="135" y1="155" x2="158" y2="155" stroke="#1b5379" stroke-width="3" marker-end="url(#a)"/><line x1="220" y1="155" x2="255" y2="155" stroke="#1b5379" stroke-width="3" marker-end="url(#a)"/><rect x="260" y="115" width="90" height="80" rx="4" fill="#fff" stroke="#1b5379" stroke-width="3"/><text x="305" y="148" class="small" text-anchor="middle">Clasificar</text><text x="305" y="175" class="small" text-anchor="middle">destino</text><line x1="355" y1="155" x2="390" y2="155" stroke="#1b5379" stroke-width="3" marker-end="url(#a)"/><rect x="395" y="125" width="60" height="50" rx="4" fill="#e2f0f6" stroke="#1b5379" stroke-width="3"/><text x="425" y="205" class="small" text-anchor="middle">Salida</text><text x="240" y="280" class="label" text-anchor="middle">Pedido → control → despacho</text></svg>