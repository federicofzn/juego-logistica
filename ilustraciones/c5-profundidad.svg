<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Simple y doble profundidad</title><desc id="desc">Arriba, cada pallet tiene acceso directo. Abajo, visto desde el frente indicado, el pallet B queda delante de A y puede requerir su retirada.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#18364a">Simple profundidad</text><rect x="120" y="60" width="105" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="120" y1="113" x2="225" y2="113" stroke="#1b5379" stroke-width="5"/><line x1="128" y1="113" x2="128" y2="120" stroke="#1b5379" stroke-width="3"/><line x1="217" y1="113" x2="217" y2="120" stroke="#1b5379" stroke-width="3"/><text x="172.5" y="91.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">A</text><rect x="255" y="60" width="105" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="255" y1="113" x2="360" y2="113" stroke="#1b5379" stroke-width="5"/><line x1="263" y1="113" x2="263" y2="120" stroke="#1b5379" stroke-width="3"/><line x1="352" y1="113" x2="352" y2="120" stroke="#1b5379" stroke-width="3"/><text x="307.5" y="91.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">B</text><line x1="172" y1="166" x2="172" y2="125" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><line x1="307" y1="166" x2="307" y2="125" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="240" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">acceso directo</text><text x="240" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#18364a">Doble profundidad</text><rect x="70" y="285" width="95" height="40" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="70" y1="330" x2="165" y2="330" stroke="#1b5379" stroke-width="5"/><line x1="78" y1="330" x2="78" y2="337" stroke="#1b5379" stroke-width="3"/><line x1="157" y1="330" x2="157" y2="337" stroke="#1b5379" stroke-width="3"/><text x="117.5" y="312.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">A</text><rect x="180" y="285" width="95" height="40" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="180" y1="330" x2="275" y2="330" stroke="#1b5379" stroke-width="5"/><line x1="188" y1="330" x2="188" y2="337" stroke="#1b5379" stroke-width="3"/><line x1="267" y1="330" x2="267" y2="337" stroke="#1b5379" stroke-width="3"/><text x="227.5" y="312.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">B</text><line x1="370" y1="310" x2="285" y2="310" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="410" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">frente</text><text x="400" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#18364a">B tapa A</text></svg>