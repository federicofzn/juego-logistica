<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
<title id="title">Curva ABC ilustrativa</title><desc id="desc">Gráfico cualitativo de contribución acumulada frente a referencias acumuladas, ordenadas de mayor a menor contribución. La curva sube con fuerza en A y se aplana hacia C. No se muestran porcentajes ni cortes fijos.</desc>
<rect width="600" height="480" rx="18" fill="#f4f8fa"/>
<g font-family="Arial, sans-serif" fill="#1b5379" stroke-linecap="round" stroke-linejoin="round"><text x="300" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#1b5379">Curva acumulada ilustrativa</text><rect x="100" y="90" width="130" height="285" rx="0" fill="#e0eef4" stroke="none" stroke-width="0"/><rect x="230" y="90" width="125" height="285" rx="0" fill="#f7e7cf" stroke="none" stroke-width="0"/><rect x="355" y="90" width="150" height="285" rx="0" fill="#e9f0e8" stroke="none" stroke-width="0"/><path d="M100 375 H520 M100 375 V78" fill="none" stroke="#1b5379" stroke-width="4"/><path d="M100 375 C130 225 184 164 230 144 S315 119 355 112 S450 100 505 96" fill="none" stroke="#bd5e18" stroke-width="7"/><text x="165" y="344" text-anchor="middle" font-size="30" font-weight="700" fill="#1b5379">A</text><text x="292" y="344" text-anchor="middle" font-size="30" font-weight="700" fill="#1b5379">B</text><text x="430" y="344" text-anchor="middle" font-size="30" font-weight="700" fill="#1b5379">C</text><text x="310" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#1b5379">Referencias acumuladas →</text><text x="38" y="225" transform="rotate(-90 38 225)" text-anchor="middle" font-size="22" font-weight="700">Indicador acumulado →</text><text x="300" y="459" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5379">Cortes según los datos y el criterio</text></g>
</svg>
