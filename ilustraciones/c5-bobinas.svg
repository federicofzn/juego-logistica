<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Bobinas en cuna y en eje</title><desc id="desc">A la izquierda una bobina circular descansa en una cuna que impide rodar; a la derecha una bobina cilíndrica está montada en un eje sostenido por dos apoyos y una flecha curva indica giro.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="120" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18364a">Bobina en cuna</text><text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#18364a">Bobina en eje</text><circle cx="120" cy="165" r="68" fill="#f7dcb8" stroke="#bd5e18" stroke-width="5"/><circle cx="120" cy="165" r="17" fill="white" stroke="#bd5e18" stroke-width="3"/><path d="M 48 251 L 72 208 L 88 226 Q 120 242 152 226 L 168 208 L 192 251 Z" fill="#dcecf4" stroke="#1b5379" stroke-width="4" stroke-linejoin="round"/><line x1="40" y1="252" x2="200" y2="252" stroke="#1b5379" stroke-width="5"/><rect x="310" y="103" width="100" height="124" fill="#f7dcb8" stroke="#bd5e18" stroke-width="4"/><ellipse cx="310" cy="165" rx="20" ry="62" fill="#f7dcb8" stroke="#bd5e18" stroke-width="4"/><ellipse cx="410" cy="165" rx="20" ry="62" fill="#f7dcb8" stroke="#bd5e18" stroke-width="4"/><line x1="260" y1="165" x2="460" y2="165" stroke="#1b5379" stroke-width="8"/><line x1="275" y1="165" x2="275" y2="253" stroke="#1b5379" stroke-width="7"/><line x1="445" y1="165" x2="445" y2="253" stroke="#1b5379" stroke-width="7"/><line x1="258" y1="253" x2="290" y2="253" stroke="#1b5379" stroke-width="5"/><line x1="430" y1="253" x2="460" y2="253" stroke="#1b5379" stroke-width="5"/><path d="M 338 95 Q 390 75 417 117" fill="none" stroke="#bd5e18" stroke-width="5" stroke-linejoin="round"/><line x1="403" y1="99" x2="417" y2="117" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="120" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#18364a">apoyo contra rodamiento</text><text x="360" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">giro sobre el eje</text></svg>