<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
<title id="title">Modularidad sobre europaleta</title><desc id="desc">Vista superior de una europaleta de 1.200 por 800 milímetros cubierta por cuatro cajas de 600 por 400 milímetros, en dos columnas y dos filas, sin espacios ni salientes.</desc>
<rect width="600" height="480" rx="18" fill="#f4f8fa"/>
<g font-family="Arial, sans-serif" fill="#1b5379" stroke-linecap="round" stroke-linejoin="round"><text x="300" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#1b5379">Una capa, vista superior</text><rect x="130" y="130" width="170" height="115" rx="0" fill="#f5d9ad" stroke="#1b5379" stroke-width="4"/><text x="215" y="183" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">Caja</text><text x="215" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5379">600 × 400</text><rect x="130" y="245" width="170" height="115" rx="0" fill="#f5d9ad" stroke="#1b5379" stroke-width="4"/><text x="215" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">Caja</text><text x="215" y="327" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5379">600 × 400</text><rect x="300" y="130" width="170" height="115" rx="0" fill="#f5d9ad" stroke="#1b5379" stroke-width="4"/><text x="385" y="183" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">Caja</text><text x="385" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5379">600 × 400</text><rect x="300" y="245" width="170" height="115" rx="0" fill="#f5d9ad" stroke="#1b5379" stroke-width="4"/><text x="385" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">Caja</text><text x="385" y="327" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5379">600 × 400</text><path d="M130 105 V88 H470 V105 M106 130 H90 V360 H106" fill="none" stroke="#bd5e18" stroke-width="4"/><text x="300" y="78" text-anchor="middle" font-size="24" font-weight="700" fill="#bd5e18">1.200 mm</text><text x="67" y="245" transform="rotate(-90 67 245)" text-anchor="middle" font-size="24" font-weight="700" fill="#bd5e18">800 mm</text><text x="300" y="414" text-anchor="middle" font-size="25" font-weight="700" fill="#1b5379">4 cajas de 600 × 400 mm</text><text x="300" y="450" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">sobre una europaleta</text></g>
</svg>
