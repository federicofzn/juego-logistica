<title id="titulo">Pallet a puesto de preparación</title><desc id="descripcion">Un pallet sale del área de reserva por un transportador hacia un puesto en cabecera, donde una persona extrae las unidades del pedido. Las flechas indican el movimiento hacia el puesto.</desc>
