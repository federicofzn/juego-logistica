<title id="titulo">Miniload con transelevador</title><desc id="descripcion">Entre dos estanterías de cajas, un transelevador se desplaza y eleva una plataforma. Una flecha vertical indica elevación y otra señala la transferencia de la caja hacia una ubicación.</desc>
