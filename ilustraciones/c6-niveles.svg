<title id="titulo">Suelo, bajo, medio y alto</title><desc id="descripcion">Una estantería de cuatro niveles muestra cajas desde el suelo hasta la parte alta. Las flechas señalan cada nivel: suelo, bajo, medio y alto.</desc>
