<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Equipo compatible en pasillo estrecho</title><desc id="descripcion">Vista esquemática de un pasillo entre dos estanterías. Una carretilla de mástil elevado ocupa el corredor y la flecha muestra la transferencia lateral de la carga hacia una ubicación. Se deben comprobar las dimensiones, el guiado y las holguras.</desc>
