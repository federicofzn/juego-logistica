<title id="title">Apilado inestable y carga sobre cajas frágiles</title><desc id="desc">Vista frontal de dos cajas frágiles sobre una paleta y dos cajas pesadas desalineadas encima. Una caja pesada sobresale del soporte. Existe riesgo de caída y aplastamiento.</desc>
