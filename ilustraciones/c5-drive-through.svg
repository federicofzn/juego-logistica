<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Drive-through: FIFO</title><desc id="desc">Canal abierto en ambos extremos: la carretilla carga por la izquierda y se retira por la derecha. A está más cerca de salida que B, por lo que A sale primero.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#18364a">Drive-through: dos extremos</text><line x1="50" y1="95" x2="430" y2="95" stroke="#1b5379" stroke-width="7"/><line x1="50" y1="260" x2="430" y2="260" stroke="#1b5379" stroke-width="7"/><rect x="150" y="180" width="85" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="150" y1="233" x2="235" y2="233" stroke="#1b5379" stroke-width="5"/><line x1="158" y1="233" x2="158" y2="240" stroke="#1b5379" stroke-width="3"/><line x1="227" y1="233" x2="227" y2="240" stroke="#1b5379" stroke-width="3"/><text x="192.5" y="211.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">B</text><rect x="260" y="180" width="85" height="48" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="260" y1="233" x2="345" y2="233" stroke="#1b5379" stroke-width="5"/><line x1="268" y1="233" x2="268" y2="240" stroke="#1b5379" stroke-width="3"/><line x1="337" y1="233" x2="337" y2="240" stroke="#1b5379" stroke-width="3"/><text x="302.5" y="211.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">A</text><g transform="translate(40 171) scale(0.65)"><rect x="5" y="48" width="77" height="34" rx="5" fill="#e9b16d" stroke="#1b5379" stroke-width="4"/><path d="M 22 48 L 32 14 L 66 14 L 78 48 Z" fill="#dcecf4" stroke="#1b5379" stroke-width="4" stroke-linejoin="round"/><line x1="32" y1="14" x2="25" y2="48" stroke="#1b5379" stroke-width="4"/><line x1="66" y1="14" x2="66" y2="48" stroke="#1b5379" stroke-width="4"/><circle cx="23" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><circle cx="68" cy="85" r="11" fill="#fff" stroke="#1b5379" stroke-width="4"/><line x1="91" y1="4" x2="91" y2="84" stroke="#1b5379" stroke-width="7"/><line x1="101" y1="4" x2="101" y2="84" stroke="#1b5379" stroke-width="4"/><path d="M 101 80 L 145 80" fill="none" stroke="#1b5379" stroke-width="6" stroke-linejoin="round"/></g><line x1="28" y1="80" x2="138" y2="80" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><line x1="345" y1="80" x2="455" y2="80" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="90" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">entrada</text><text x="385" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">salida</text><text x="240" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">Entra A, luego B; sale A primero</text></svg>