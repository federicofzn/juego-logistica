<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc"><title id="title">Push-back: LIFO</title><desc id="desc">Pallets A y B están sobre carros en un carril inclinado hacia el frente izquierdo. Al cargar, B empuja A hacia el fondo; al retirar B, A vuelve por gravedad. La carga y descarga usan el mismo frente.</desc><defs><marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd5e18"/></marker></defs><rect width="480" height="360" rx="14" fill="#f4f8fa"/><text x="240" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#18364a">Push-back: frente único</text><text x="88" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">frente</text><line x1="78" y1="260" x2="410" y2="225" stroke="#1b5379" stroke-width="7"/><rect x="105" y="185" width="90" height="45" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="105" y1="235" x2="195" y2="235" stroke="#1b5379" stroke-width="5"/><line x1="113" y1="235" x2="113" y2="242" stroke="#1b5379" stroke-width="3"/><line x1="187" y1="235" x2="187" y2="242" stroke="#1b5379" stroke-width="3"/><text x="150.0" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">B</text><rect x="235" y="170" width="90" height="45" rx="0" fill="#f7dcb8" stroke="#bd5e18" stroke-width="3"/><line x1="235" y1="220" x2="325" y2="220" stroke="#1b5379" stroke-width="5"/><line x1="243" y1="220" x2="243" y2="227" stroke="#1b5379" stroke-width="3"/><line x1="317" y1="220" x2="317" y2="227" stroke="#1b5379" stroke-width="3"/><text x="280.0" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">A</text><circle cx="125" cy="249" r="7" fill="white" stroke="#1b5379" stroke-width="3"/><circle cx="178" cy="244" r="7" fill="white" stroke="#1b5379" stroke-width="3"/><line x1="111" y1="240" x2="196" y2="232" stroke="#bd5e18" stroke-width="4"/><circle cx="255" cy="234" r="7" fill="white" stroke="#1b5379" stroke-width="3"/><circle cx="308" cy="229" r="7" fill="white" stroke="#1b5379" stroke-width="3"/><line x1="240" y1="225" x2="325" y2="216" stroke="#bd5e18" stroke-width="4"/><line x1="65" y1="130" x2="190" y2="130" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="280" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#18364a">carga empuja</text><line x1="225" y1="290" x2="90" y2="290" stroke="#bd5e18" stroke-width="5" marker-end="url(#arrowO)"/><text x="290" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#18364a">retorno por gravedad</text><text x="240" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#18364a">Entra A, luego B; sale B</text></svg>