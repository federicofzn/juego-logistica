<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
<title id="title">Apilado estable con resistencia verificada</title><desc id="desc">Vista frontal de cuatro cajas alineadas sobre una paleta apoyada en el suelo. Dos cajas resistentes abajo sostienen dos cajas livianas arriba. La estabilidad depende de verificar resistencia y límites de carga.</desc>
<rect width="600" height="480" rx="18" fill="#f4f8fa"/>
<g font-family="Arial, sans-serif" fill="#1b5379" stroke-linecap="round" stroke-linejoin="round"><text x="300" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1b5379">Apoyos alineados</text><rect x="120" y="247" width="180" height="90" rx="0" fill="#e8bd7f" stroke="#1b5379" stroke-width="3"/><path d="M210.0 247 v18" stroke="#1b5379" stroke-width="3"/><text x="210.0" y="300.0" text-anchor="middle" font-size="23" font-weight="700" fill="#1b5379">Resistente</text><rect x="300" y="247" width="180" height="90" rx="0" fill="#e8bd7f" stroke="#1b5379" stroke-width="3"/><path d="M390.0 247 v18" stroke="#1b5379" stroke-width="3"/><text x="390.0" y="300.0" text-anchor="middle" font-size="23" font-weight="700" fill="#1b5379">Resistente</text><rect x="120" y="157" width="180" height="90" rx="0" fill="#f7deb8" stroke="#1b5379" stroke-width="3"/><path d="M210.0 157 v18" stroke="#1b5379" stroke-width="3"/><text x="210.0" y="210.0" text-anchor="middle" font-size="23" font-weight="700" fill="#1b5379">Liviana</text><rect x="300" y="157" width="180" height="90" rx="0" fill="#f7deb8" stroke="#1b5379" stroke-width="3"/><path d="M390.0 157 v18" stroke="#1b5379" stroke-width="3"/><text x="390.0" y="210.0" text-anchor="middle" font-size="23" font-weight="700" fill="#1b5379">Liviana</text><rect x="105" y="337" width="390" height="20" rx="0" fill="#c79258" stroke="#1b5379" stroke-width="3"/><rect x="115" y="357" width="50" height="24" rx="0" fill="#b98248" stroke="#1b5379" stroke-width="3"/><rect x="270" y="357" width="50" height="24" rx="0" fill="#b98248" stroke="#1b5379" stroke-width="3"/><rect x="425" y="357" width="50" height="24" rx="0" fill="#b98248" stroke="#1b5379" stroke-width="3"/><path d="M70 382 H530" stroke="#1b5379" stroke-width="4"/><text x="300" y="424" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5379">Peso y resistencia verificados</text><text x="300" y="457" text-anchor="middle" font-size="22" font-weight="700" fill="#1b5379">antes de añadir niveles</text></g>
</svg>
